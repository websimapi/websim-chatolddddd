<html><head><base href="https://websim.ai/"><title>Global Chat</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100%;
  }
  #chat-window {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    height: 400px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease-in-out;
    transform: translateY(calc(100% - 40px));
  }
  #chat-window.open {
    transform: translateY(0);
  }
  #chat-header {
    background-color: #007bff;
    color: white;
    padding: 10px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  #chat-toggle {
    width: 20px;
    height: 20px;
    transition: transform 0.3s ease-in-out;
  }
  #chat-window.open #chat-toggle {
    transform: rotate(180deg);
  }
  #chat-messages {
    flex-grow: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .message {
    margin-bottom: 10px;
    padding: 5px 10px;
    border-radius: 10px;
    max-width: 80%;
    word-wrap: break-word;
  }
  .message.sent {
    background-color: #007bff;
    color: white;
    align-self: flex-end;
    margin-left: auto;
  }
  .message.received {
    background-color: #f1f1f1;
    align-self: flex-start;
  }
  #chat-input {
    display: flex;
    padding: 10px;
  }
  #message-input {
    flex-grow: 1;
    padding: 5px;
    border: 1px solid #ddd;
    border-radius: 5px;
  }
  #send-button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 5px 10px;
    margin-left: 5px;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="chat-window">
  <div id="chat-header">
    Global Chat
    <svg id="chat-toggle" viewBox="0 0 24 24">
      <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z" fill="white"/>
    </svg>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input">
    <input type="text" id="message-input" placeholder="Type a message...">
    <button id="send-button">Send</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script>
let currentUser;

async function createMessageTable() {
  let query = `CREATE TABLE if not exists messages (id INTEGER PRIMARY KEY, username TEXT, message TEXT, timestamp INTEGER)`;
  await fetch('/api/v1/sql/?' + new URLSearchParams({sql: query}));
}

async function fetchMessages() {
  let query = `SELECT * FROM messages ORDER BY timestamp DESC LIMIT 10`;
  let response = await fetch('/api/v1/sql/?' + new URLSearchParams({sql: query}));
  let data = await response.json();
  
  const chatMessages = document.getElementById('chat-messages');
  chatMessages.innerHTML = ''; // Clear existing messages
  
  data.reverse().forEach(row => {
    displayMessage(row.username, row.message, row.timestamp);
  });

  // Scroll to the bottom of the chat
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function insertMessage(username, message) {
  let timestamp = Date.now();
  let query = `INSERT INTO messages (username, message, timestamp) VALUES ('${username}', '${message.replace(/'/g, "''")}', ${timestamp})`;
  await fetch('/api/v1/sql/?' + new URLSearchParams({sql: query}));
  await fetchMessages(); // Refresh messages after inserting
}

function displayMessage(username, message, timestamp) {
  const chatMessages = document.getElementById('chat-messages');
  const messageElement = document.createElement('div');
  messageElement.classList.add('message');
  messageElement.classList.add(username === currentUser.username ? 'sent' : 'received');
  
  const timeString = moment(timestamp).format('HH:mm:ss');
  messageElement.innerHTML = `<strong>${username}</strong> (${timeString}): ${message}`;
  
  chatMessages.appendChild(messageElement);
}

document.addEventListener('DOMContentLoaded', async () => {
  currentUser = await websim.getUser();
  
  await createMessageTable();
  
  const chatWindow = document.getElementById('chat-window');
  const chatHeader = document.getElementById('chat-header');
  const messageInput = document.getElementById('message-input');
  const sendButton = document.getElementById('send-button');

  chatHeader.addEventListener('click', () => {
    chatWindow.classList.toggle('open');
    if (chatWindow.classList.contains('open')) {
      fetchMessages(); // Fetch messages when opening the chat
    }
  });

  sendButton.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });

  async function sendMessage() {
    const message = messageInput.value.trim();
    if (message) {
      await insertMessage(currentUser.username, message);
      messageInput.value = '';
    }
  }

  // Fetch messages every second when the chat is open
  setInterval(() => {
    if (chatWindow.classList.contains('open')) {
      fetchMessages();
    }
  }, 1000);
});
</script>

</body></html>
